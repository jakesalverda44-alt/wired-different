services:
  - type: web
    name: wired-different
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /websites
        destination: /websites.html
      - type: rewrite
        source: /crm
        destination: /crm.html
      - type: rewrite
        source: /ai
        destination: /ai.html
      - type: rewrite
        source: /services
        destination: /services.html
      - type: rewrite
        source: /work
        destination: /work.html
      - type: rewrite
        source: /process
        destination: /process.html
      - type: rewrite
        source: /consultation
        destination: /consultation.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: redirect
        source: /index.html
        destination: /
      - type: redirect
        source: /websites.html
        destination: /websites
      - type: redirect
        source: /crm.html
        destination: /crm
      - type: redirect
        source: /ai.html
        destination: /ai
      - type: redirect
        source: /services.html
        destination: /services
      - type: redirect
        source: /work.html
        destination: /work
      - type: redirect
        source: /process.html
        destination: /process
      - type: redirect
        source: /consultation.html
        destination: /consultation
      - type: redirect
        source: /privacy.html
        destination: /privacy
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
